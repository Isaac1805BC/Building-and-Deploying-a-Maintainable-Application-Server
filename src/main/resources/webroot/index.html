<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFramework - Maintainable Application Server</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WebFramework Demo</h1>
            <p class="subtitle">A maintainable Java application server</p>
        </header>

        <main>
            <section class="card">
                <h2>Greeting Service</h2>
                <div class="greeting-form">
                    <label for="name">Enter your name:</label>
                    <div class="input-group">
                        <input type="text" id="name" placeholder="Your name" value="World">
                        <button onclick="greet()">Greet</button>
                    </div>
                    <p id="result" class="result">Enter a name and click Greet</p>
                </div>
            </section>

            <section class="card">
                <h2>Pi Service</h2>
                <p>The value of π is: <strong id="pi-value">Loading...</strong></p>
                <button onclick="loadPi()">Refresh Pi</button>
            </section>

            <section class="card">
                <h2>Static Resources</h2>
                <p>This page is served as a static HTML file.</p>
                <img src="/images/logo.png" alt="Logo" width="120" class="logo">
                <p class="caption">Static image served by the server</p>
            </section>
        </main>

        <footer>
            <p>WebFramework &copy; 2026 - Built with &lt;3 for TDSE</p>
        </footer>
    </div>
    <script src="/app.js"></script>
</body>
</html>
